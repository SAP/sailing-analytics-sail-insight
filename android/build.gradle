// Root Android build configuration aligned with React Native 0.81.6 / Android 16.
// Keep the shared Android version properties in buildscript.ext: the React Native
// root plugin configures subprojects when it is applied, so these values must
// exist before that plugin runs.
buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"

    // react-native-background-geolocation configuration.
    appCompatVersion = "1.7.0"
    playServicesLocationVersion = "21.3.0"
    googlePlayServicesLocationVersion = "21.3.0"
  }

  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }

  dependencies {
    // Pin AGP/Kotlin to the RN 0.81 Android toolchain while keeping the RN
    // Gradle plugin itself sourced from node_modules via settings.gradle.
    classpath("com.android.tools.build:gradle:8.11.0")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
    classpath("com.google.gms:google-services:4.4.2")
    classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
  }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
  repositories {
    google()
    mavenCentral()

    // Required by react-native-background-geolocation v4.x.
    maven { url("${project(':react-native-background-geolocation').projectDir}/libs") }
  }
}
