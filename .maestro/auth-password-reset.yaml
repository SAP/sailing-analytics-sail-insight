# Password reset for the run's real account: the request reaches the server
# and the app confirms it (the test server sends no actual e-mail). An
# unknown account gets the same confirmation, so accounts cannot be probed.
appId: ${APP_ID}
tags:
  - auth
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      text: "LOGIN"
    timeout: 60000
- tapOn:
    text: "LOGIN"
- tapOn:
    text: "I forgot my password.*"
- extendedWaitUntil:
    visible:
      id: "e2e-reset-username"
    timeout: 30000
- tapOn:
    id: "e2e-reset-username"
- setClipboard: ${E2E_EMAIL}
- pasteText
- hideKeyboard
- tapOn:
    text: "RESET PASSWORD"
- extendedWaitUntil:
    visible: "Please check your inbox"
    timeout: 30000
- takeScreenshot: auth-password-reset-sent
- tapOn: "OK"
- tapOn:
    text: "I forgot my password.*"
- tapOn:
    id: "e2e-reset-username"
- setClipboard: "nobody-${E2E_USERNAME}@example.test"
- pasteText
- hideKeyboard
- tapOn:
    text: "RESET PASSWORD"
- extendedWaitUntil:
    visible: "Please check your inbox"
    timeout: 30000
