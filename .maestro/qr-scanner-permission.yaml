# SCAN A QR-CODE without camera permission explains why and offers the
# system settings instead of showing a black screen. (The test emulators have
# no camera, so scanning itself is not covered here.)
appId: ${APP_ID}
tags:
  - competitor
---
- launchApp:
    clearState: true
    permissions:
      all: allow
      camera: deny
- extendedWaitUntil:
    visible:
      text: "LOGIN"
    timeout: 60000
- tapOn: "SCAN A QR-CODE"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible:
      text: "OPEN SETTINGS"
    timeout: 15000
- takeScreenshot: qr-scanner-permission-denied
