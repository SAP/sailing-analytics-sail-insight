# Offline password reset must not claim "Please check your inbox".
appId: ${APP_ID}
tags:
  - auth
  - offline
onFlowComplete:
  - runFlow: subflows/network-on.yaml
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      text: "LOGIN"
    timeout: 60000
- tapOn:
    text: "LOGIN"
- extendedWaitUntil:
    visible:
      text: "I forgot my password.*"
    timeout: 30000
- tapOn:
    text: "I forgot my password.*"
- extendedWaitUntil:
    visible:
      id: "e2e-reset-username"
    timeout: 30000
- tapOn:
    id: "e2e-reset-username"
- setClipboard: "someone@example.test"
- pasteText
- hideKeyboard
- setAirplaneMode: enabled
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "RESET PASSWORD"
- extendedWaitUntil:
    visible: ".*([Nn]etwork connection required|connected to the internet).*"
    timeout: 15000
- assertNotVisible: "Please check your inbox"
- takeScreenshot: auth-password-reset-offline
