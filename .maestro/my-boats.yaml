# Account → My boats: add a boat, then delete it — also when its name was
# edited (but not saved) before deleting.
appId: ${APP_ID}
tags:
  - boats
---
- evalScript: ${output.boat = 'Boat ' + Date.now()}
- runFlow: subflows/login.yaml
- tapOn:
    text: "Account"
- tapOn: "MY BOATS"
- tapOn:
    text: "NEW BOAT"
- tapOn:
    id: "e2e-boat-competitor-name"
- inputText: ${output.boat}
- tapOn:
    id: "e2e-boat-class"
- inputText: "Laser 2"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e-boat-sail-number"
    direction: DOWN
- tapOn:
    id: "e2e-boat-sail-number"
- eraseText: 20
- inputText: "GER 123"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "SAVE"
    direction: DOWN
- tapOn:
    text: "SAVE"
- extendedWaitUntil:
    visible: ${output.boat}
    timeout: 30000
# Scroll to the end so the saved checkpoint includes the complete last row.
- scroll
- takeScreenshot: my-boats-added

# Edit the name without saving, then delete: the boat must really be gone.
- tapOn: ${output.boat}
- tapOn:
    id: "e2e-boat-competitor-name"
- inputText: " renamed"
- hideKeyboard
- tapOn: "Delete"
- tapOn: "OK"
- extendedWaitUntil:
    visible: "NEW BOAT"
    timeout: 30000
- assertNotVisible: "${output.boat}.*"
- takeScreenshot: my-boats-after-delete
