# Competitor tracking → My Rank opens the leaderboard, which lists the
# competitor and can switch its second column; leaving it keeps tracking.
appId: ${APP_ID}
tags:
  - competitor
---
- evalScript: ${output.eventName = 'Board ' + E2E_USERNAME + ' ' + Date.now()}
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/create-event.yaml
    env:
      EVENT_NAME: ${output.eventName}
- runFlow:
    file: subflows/join-as-competitor.yaml
    env:
      COMPETITOR_NAME: "E2E Sailor"
      SAIL_NUMBER: "GER 4711"
- scrollUntilVisible:
    element: "START TRACKING"
    direction: DOWN
    centerElement: true
- setLocation:
    latitude: 54.35
    longitude: 10.15
- tapOn: "START TRACKING"
- runFlow: subflows/tracking-started.yaml
- tapOn: "My Rank"
# The sailor's own boat (whichever the account joined with) is ranked.
- extendedWaitUntil:
    visible: "My rank"
    timeout: 30000
- assertVisible: "(?i)leaderboard"
- assertVisible: "Gap to leader\\s*"
- takeScreenshot: leaderboard
# The second column can show another measure.
- tapOn: "Gap to leader\\s*"
- extendedWaitUntil:
    visible: "Average speed"
    timeout: 10000
- tapOn: "Average speed"
- extendedWaitUntil:
    visible: "Average speed\\s*"
    timeout: 10000
- assertNotVisible: "Gap to leader\\s*"
- back
- assertVisible: "STOP"
- tapOn: "STOP"
- tapOn: "YES"
- extendedWaitUntil:
    visible: "Welcome to\\s+Sail Insight"
    timeout: 30000
