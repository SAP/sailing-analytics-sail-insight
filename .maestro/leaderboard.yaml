# Competitor tracking → My Rank opens the leaderboard, which lists the
# competitor; leaving and re-opening it keeps working.
appId: ${APP_ID}
tags:
  - competitor
---
- evalScript: ${output.eventName = 'Board ' + E2E_USERNAME + ' ' + Date.now()}
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/create-event.yaml
    env:
      EVENT_NAME: ${output.eventName}
- runFlow:
    file: subflows/join-as-competitor.yaml
    env:
      COMPETITOR_NAME: "E2E Sailor"
      SAIL_NUMBER: "GER 4711"
- scrollUntilVisible:
    element: "START TRACKING"
    direction: DOWN
- setLocation:
    latitude: 54.35
    longitude: 10.15
- tapOn: "START TRACKING"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "My Rank"
    timeout: 30000
- tapOn: "My Rank"
- extendedWaitUntil:
    visible: ".*E2E Sailor.*"
    timeout: 30000
- assertVisible: "(?i)leaderboard"
- takeScreenshot: leaderboard
- back
- assertVisible: "STOP"
- tapOn: "STOP"
- tapOn: "YES"
- extendedWaitUntil:
    visible: "Welcome to\\s+Sail Insight"
    timeout: 30000
