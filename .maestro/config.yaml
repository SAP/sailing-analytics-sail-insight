# Top-level flows only; subflows/ are helpers. auth-register-login runs first
# and creates the run's account that the other flows log in with;
# events-empty-state must see that account before any flow creates events.
# Organizer flows need the backend provisioning done by e2e/backend.sh.
flows:
  - "*"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - auth-register-login
    - events-empty-state
