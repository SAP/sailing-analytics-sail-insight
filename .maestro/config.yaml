# Top-level flows only; subflows/ are helpers. auth-register-login runs first
# and creates the run's account that the other flows log in with.
# Flows tagged needs-create-permission require a backend where new users may
# create events.
flows:
  - "*"
excludeTags:
  - needs-create-permission
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - auth-register-login
