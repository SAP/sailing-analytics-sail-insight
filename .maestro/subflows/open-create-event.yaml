# From the main tabs, open Create Event and fill name/venue/boat class.
appId: ${APP_ID}
---
- tapOn:
    text: "Events"
- extendedWaitUntil:
    visible:
      text: "CREATE A NEW EVENT"
    timeout: 30000
- tapOn:
    text: "CREATE A NEW EVENT"
- extendedWaitUntil:
    visible:
      id: "e2e-event-venue"
    timeout: 30000
- runFlow:
    when:
      true: ${VENUE != ''}
    commands:
      - tapOn:
          id: "e2e-event-venue"
      - inputText: ${VENUE}
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e-event-boat-class"
    direction: DOWN
- tapOn:
    id: "e2e-event-boat-class"
- inputText: "Laser 2"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "CREATE"
    direction: DOWN
