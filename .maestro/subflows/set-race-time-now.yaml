# Race Overview: set the first race whose time is not set yet to now. The
# native date and time pickers open at the current time; each OK is tapped
# only once its picker is shown (taps during the transition get lost).
appId: ${APP_ID}
---
- tapOn:
    text: "Set Time"
    index: 0
- extendedWaitUntil:
    visible:
      id: "android:id/button1"
    timeout: 10000
- tapOn:
    id: "android:id/button1"
- extendedWaitUntil:
    visible:
      id: "android:id/divider"
    timeout: 10000
- tapOn:
    id: "android:id/button1"
# The event starts at its creation time and the picker has whole minutes, so
# "now" right after creating the event can fall seconds before the event start.
- runFlow:
    when:
      visible: "This start time is outside the date range.*"
    commands:
      - tapOn: "PROCEED"
- extendedWaitUntil:
    notVisible:
      id: "android:id/button1"
    timeout: 10000
- extendedWaitUntil:
    visible: "GO TO SAP SAILING ANALYTICS"
    timeout: 30000
