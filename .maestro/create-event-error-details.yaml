# A legitimate server rejection (an event with this name already exists) is
# explained to everybody; pro users (Expert settings → "Show technical error
# details") can additionally expand what the server actually answered.
appId: ${APP_ID}
tags:
  - create-event
  - organizer
---
# Unique per run, so re-runs with the same account never collide.
- evalScript: ${output.eventName = 'Duplicate ' + Date.now()}
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/create-event.yaml
    env:
      EVENT_NAME: ${output.eventName}
- back
- runFlow:
    file: subflows/open-create-event.yaml
    env:
      VENUE: "Kiel"
- scrollUntilVisible:
    element:
      id: "e2e-event-name"
    direction: UP
- tapOn:
    id: "e2e-event-name"
- inputText: ${output.eventName}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "CREATE"
    direction: DOWN
- tapOn:
    text: "CREATE"
- extendedWaitUntil:
    visible: ".*already exists.*"
    timeout: 30000
- assertNotVisible: ".*Oops.*"
# Technical details are hidden for normal users.
- assertNotVisible:
    text: "Show details"
- takeScreenshot: create-event-duplicate-normal-user

# Enable technical details in the hidden Expert settings (15 taps on the version).
- back
- tapOn:
    text: "Account"
- tapOn: "SETTINGS"
- repeat:
    times: 15
    commands:
      - tapOn:
          id: "e2e-expert-settings-trigger"
- extendedWaitUntil:
    visible:
      id: "e2e-show-error-details-switch"
    timeout: 10000
- tapOn:
    id: "e2e-show-error-details-switch"
- back
- back
- runFlow:
    file: subflows/open-create-event.yaml
    env:
      VENUE: "Kiel"
- scrollUntilVisible:
    element:
      id: "e2e-event-name"
    direction: UP
- tapOn:
    id: "e2e-event-name"
- inputText: ${output.eventName}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "CREATE"
    direction: DOWN
- tapOn:
    text: "CREATE"
- extendedWaitUntil:
    visible:
      text: "Show details"
    timeout: 30000
- takeScreenshot: create-event-duplicate-details-collapsed
- tapOn:
    text: "Show details"
- assertVisible: ".*POST .*createEvent.*"
- assertVisible: ".*Status: 4\\d\\d.*"
- scrollUntilVisible:
    element:
      text: "Copy technical details"
    direction: DOWN
- takeScreenshot: create-event-duplicate-details-expanded
- tapOn:
    text: "Copy technical details"
- assertVisible: ".*Diagnostics copied to clipboard.*"
- tapOn: "OK"
- tapOn:
    text: "Hide details"
- assertNotVisible: ".*POST .*createEvent.*"
# Returning to settings and disabling the option restores normal-user behavior.
- back
- tapOn:
    text: "Account"
- tapOn: "SETTINGS"
- repeat:
    times: 15
    commands:
      - tapOn:
          id: "e2e-expert-settings-trigger"
- tapOn:
    id: "e2e-show-error-details-switch"
- back
- back
- launchApp:
    clearState: false
