appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible:
      text: "REGISTER"
    timeout: 60000
- tapOn:
    text: "REGISTER"

- extendedWaitUntil:
    visible:
      id: "e2e-register-username"
    timeout: 30000
- tapOn:
    id: "e2e-register-username"
# Paste atomically: fast key events can race controlled Redux form updates.
- setClipboard: ${E2E_USERNAME}
- pasteText
- tapOn:
    id: "e2e-register-password"
- setClipboard: ${E2E_PASSWORD}
- pasteText
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e-register-email"
    direction: DOWN
- tapOn:
    id: "e2e-register-email"
- setClipboard: ${E2E_EMAIL}
- pasteText
- hideKeyboard
- tapOn:
    text: "REGISTER"

# Registration logs the user in and opens optional first-boat onboarding.
- extendedWaitUntil:
    visible:
      text: "Skip"
    timeout: 60000
- tapOn:
    text: "Skip"

# Open the account and user profile; the username comes from the protected user API.
- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 60000
- tapOn:
    text: "Account"
- extendedWaitUntil:
    visible: ${E2E_USERNAME}
    timeout: 30000
- tapOn: ${E2E_USERNAME}
- extendedWaitUntil:
    visible: "LOG OUT"
    timeout: 30000
- tapOn: "LOG OUT"
- tapOn: "OK"

# Log back in with the same account.
- extendedWaitUntil:
    visible:
      text: "LOGIN"
    timeout: 30000
- tapOn:
    text: "LOGIN"
- extendedWaitUntil:
    visible:
      id: "e2e-login-username"
    timeout: 30000
- tapOn:
    id: "e2e-login-username"
- setClipboard: ${E2E_USERNAME}
- pasteText
- tapOn:
    id: "e2e-login-password"
- setClipboard: ${E2E_PASSWORD}
- pasteText
- hideKeyboard
- tapOn:
    text: "LOGIN"
    below: "Password"

# Final assertion: authenticated user data is loaded after the second login.
- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 60000
- tapOn:
    text: "Account"
- extendedWaitUntil:
    visible: ${E2E_USERNAME}
    timeout: 30000
- assertVisible: ${E2E_USERNAME}
