# Organizer course editor beyond pinging: type a mark position by hand
# (impossible coordinates are rejected and never saved), add a mark and
# delete it again; each change survives saving and reopening.
appId: ${APP_ID}
tags:
  - organizer
---
- evalScript: ${output.eventName = 'Edit course ' + E2E_USERNAME + ' ' + Date.now()}
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/create-event.yaml
    env:
      EVENT_NAME: ${output.eventName}
- tapOn: "DEFINE RACES"
- extendedWaitUntil:
    visible: "R1"
    timeout: 30000
- tapOn:
    text: "Define Course"
    index: 0
- extendedWaitUntil:
    visible: "Race Course"
    timeout: 30000
- runFlow:
    when:
      visible: "Turn on"
    commands:
      - tapOn: "Turn on"
# Windward mark (the strip is not exposed as text).
- tapOn:
    point: "39%,17%"
- extendedWaitUntil:
    visible: ".*Windward.*"
    timeout: 10000
- tapOn: "Location"
- tapOn: "Define Position On Map"
- extendedWaitUntil:
    visible:
      id: "e2e-latitude-degrees"
    timeout: 30000
# 91° N does not exist.
- tapOn:
    id: "e2e-latitude-degrees"
- eraseText
- setClipboard: "91"
- pasteText
- tapOn:
    id: "e2e-latitude-minutes"
- extendedWaitUntil:
    visible: "Latitude - .*"
    timeout: 10000
- takeScreenshot: course-manual-position-invalid
- tapOn: "Save"
- assertVisible:
    id: "e2e-latitude-degrees"
# A valid position is taken over.
- tapOn:
    id: "e2e-latitude-degrees"
- eraseText
- setClipboard: "54"
- pasteText
- tapOn:
    id: "e2e-latitude-minutes"
- eraseText
- setClipboard: "22.5"
- pasteText
- tapOn:
    id: "e2e-longitude-degrees"
- eraseText
- setClipboard: "10"
- pasteText
- tapOn:
    id: "e2e-longitude-minutes"
- eraseText
- setClipboard: "12"
- pasteText
- tapOn:
    id: "e2e-latitude-degrees"
- hideKeyboard
- assertNotVisible: "Latitude - .*"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "N 54° 22.500' / E 10° 12.000'"
    timeout: 30000
- takeScreenshot: course-manual-position-saved

# Add a mark: + after W → Leeward Mark. The course has two marks after saving.
- tapOn:
    point: "53%,17%"
- tapOn: "(L) Leeward Mark"
- extendedWaitUntil:
    visible: "Delete this Mark from Course"
    timeout: 10000
- takeScreenshot: course-mark-added
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Race Overview"
    timeout: 30000
- extendedWaitUntil:
    visible: "S-•-•-F"
    timeout: 30000

# Reopen, delete the leeward mark again: back to one mark.
- tapOn:
    text: "S-•-•-F"
    index: 0
- extendedWaitUntil:
    visible: ".*Start/Finish Pin.*"
    timeout: 30000
# Strip: Start, W, L, +, Finish – L is where + was.
- tapOn:
    point: "53%,17%"
- extendedWaitUntil:
    visible: ".*Leeward Mark.*"
    timeout: 10000
- tapOn: "Delete this Mark from Course"
- assertNotVisible: ".*Leeward Mark.*"
- tapOn: "Save"
# Following races already have a course: the app asks before overwriting them.
- extendedWaitUntil:
    visible: "Do you want to overwrite the next courses?"
    timeout: 30000
- takeScreenshot: course-copy-question
- tapOn: "CANCEL"
- extendedWaitUntil:
    visible: "Race Overview"
    timeout: 30000
# R1 has one mark again, R2 keeps its two.
- extendedWaitUntil:
    visible:
      text: "S-•-F"
      index: 0
    timeout: 30000
- assertVisible: "S-•-•-F"
